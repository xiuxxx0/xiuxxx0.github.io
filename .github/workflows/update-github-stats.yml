name: Update GitHub Stats

on:
  schedule:
    # 每小时运行一次
    - cron: '0 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          # 获取用户信息 (带认证，避免 API 限流)
          fetch_stats() {
            USER=$(curl -s --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/users/xiuxxx0")
            PUBLIC_REPOS=$(echo "$USER" | jq -r '.public_repos // 0')
            FOLLOWERS=$(echo "$USER" | jq -r '.followers // 0')

            # 获取仓库列表并计算 Star 总数 (带认证 + 分页兜底)
            STARS=$(curl -s --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/users/xiuxxx0/repos?per_page=100" | jq '[.[] | select(.fork == false) | .stargazers_count] | add // 0')
          }

          # 拉取失败时最多重试 3 次，间隔 15 秒
          retry=0
          until fetch_stats; do
            retry=$((retry + 1))
            if [ "$retry" -ge 3 ]; then
              echo "Failed to fetch GitHub stats after 3 attempts" >&2
              exit 1
            fi
            echo "Fetch attempt ${retry} failed, retrying in 15s..." >&2
            sleep 15
          done

          # 写入 JSON 文件
          cat > data/github-stats.json << EOF
          {
            "public_repos": ${PUBLIC_REPOS},
            "stars": ${STARS},
            "followers": ${FOLLOWERS},
            "updated_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Fetch contribution calendar
        run: |
          set -eo pipefail
          curl -sL --retry 3 "https://github.com/users/xiuxxx0/contributions" -o /tmp/contrib.html
          if ! grep -q 'data-count' /tmp/contrib.html; then
            echo "贡献日历抓取失败，跳过本次更新" >&2
            exit 0
          fi
          python3 - <<'PY'
import re, json, sys
html = open('/tmp/contrib.html', encoding='utf-8').read()
pairs = [(m.group(1), int(m.group(2))) for m in re.finditer(r'data-date="(\d{4}-\d{2}-\d{2})"[^>]*data-count="(\d+)"', html)]
if not pairs:
    print('no contribution data found')
    sys.exit(0)
year = int(max(d for d, c in pairs)[:4])
days = [{'d': d, 'c': c} for d, c in pairs if d.startswith(str(year))]
total = sum(e['c'] for e in days)
json.dump({'year': year, 'total': total, 'days': days}, open('data/contributions.json', 'w', encoding='utf-8'), ensure_ascii=False)
print('calendar updated:', len(days), 'days,', total, 'contributions')
PY

      - name: Commit and push
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # push 失败时先同步远端再重试，最多 3 次
          push_changes() {
            git add data/github-stats.json data/contributions.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update GitHub stats [skip ci]"
            fi
            git push
          }

          retry=0
          until push_changes; do
            retry=$((retry + 1))
            if [ "$retry" -ge 3 ]; then
              echo "Failed to push after 3 attempts" >&2
              exit 1
            fi
            echo "Push attempt ${retry} failed, pulling latest and retrying..." >&2
            git pull --rebase
            sleep 5
          done
