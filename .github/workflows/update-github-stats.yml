name: Update GitHub Stats

on:
  schedule:
    # 每小时运行一次
    - cron: '0 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch contribution calendar
        run: python3 scripts/update-contrib.py

      - name: Commit and push
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # push 失败时先同步远端再重试，最多 3 次
          push_changes() {
            git add data/github-stats.json data/contributions.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update GitHub stats [skip ci]"
            fi
            git push
          }

          retry=0
          until push_changes; do
            retry=$((retry + 1))
            if [ "$retry" -ge 3 ]; then
              echo "Failed to push after 3 attempts" >&2
              exit 1
            fi
            echo "Push attempt ${retry} failed, pulling latest and retrying..." >&2
            git pull --rebase
            sleep 5
          done
